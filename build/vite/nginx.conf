map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {

    server_name webcode.host *.webcode.host;

    location = /__nginx_test__ {
        return 200 "nginx is handling this\n";
        add_header Content-Type text/plain;
    }

    # --- Default route: everything else to localhost:8080 ---
    location / {
        proxy_pass http://localhost:8082/;

        # Preserve headers
        proxy_set_header Host webcode.host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- WebSocket support for root and subpaths ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }


    listen 443 ssl default_server; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    ssl_certificate /etc/letsencrypt/live/webcode.host/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/webcode.host/privkey.pem; # managed by Certbot
}

server {
    listen 80;
    server_name webcode.host *.webcode.host;
    return 301 https://$host$request_uri;
}
